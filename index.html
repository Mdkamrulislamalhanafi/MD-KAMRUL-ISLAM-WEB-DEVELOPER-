<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD KAMRUL ISLAM | Web Developer Dashboard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #333;
  padding: 15px;
}

/* প্রজেক্ট হেডার স্টাইল (MK লোগো সহ) */
.project-header {
  text-align: center;
  background: #111;
  color: white;
  padding: 25px 15px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  border-bottom: 4px solid #c9a227;
}

.mk-logo-circle {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #111;
  color: white;
  border: 3px solid #c9a227;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: bold;
  margin: 0 auto 12px auto;
}

.project-header h1 {
  font-size: 22px;
  margin-bottom: 5px;
  color: #ffffff;
  letter-spacing: 1px;
}
.project-header p {
  font-size: 14px;
  color: #c9a227;
  font-weight: 500;
}

/* ড্যাশবোর্ড গ্রিড */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  max-width: 600px;
  margin: 0 auto 20px auto;
}

.card {
  background: #1b4d3e;
  color: white;
  padding: 20px 10px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  border: 1px solid #c9a227;
}

.card h3 {
  font-size: 15px;
  margin-top: 8px;
  margin-bottom: 5px;
}

.card p {
  font-size: 12px;
  color: #d1d5db;
}

/* অ্যাডমিন লগইন সেকশন */
.admin-login-box {
  background: white;
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.admin-login-box h2 {
  text-align: center;
  margin-bottom: 15px;
  font-size: 20px;
  color: #111;
}

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
  color: #555;
}

.form-group input {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

.login-btn-container {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
}

.login-btn {
  background: #111;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.login-btn:hover {
  background: #333;
}

.forgot-pass {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
}

.forgot-pass a {
  color: #111;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- হেডার সেকশন (MK লোগো এবং নাম সহ) -->
<div class="project-header">
  <div class="mk-logo-circle">MK</div>
  <h1>MD KAMRUL ISLAM</h1>
  <p>WEB DEVELOPER</p>
</div>

<!-- ড্যাশবোর্ড কার্ডসমূহ -->
<div class="dashboard-grid">
  <div class="card">
    <div style="font-size: 22px;">👨‍💻</div>
    <h3>Projects</h3>
    <p>পোর্টফোলিও প্রজেক্ট</p>
  </div>

  <div class="card">
    <div style="font-size: 22px;">🌐</div>
    <h3>Web Design</h3>
    <p>মডার্ন ডিজাইন</p>
  </div>

  <div class="card">
    <div style="font-size: 22px;">📅</div>
    <h3>Activity</h3>
    <p>Active</p>
  </div>

  <div class="card">
    <div style="font-size: 22px;">📊</div>
    <h3>Analytics</h3>
    <p>পারফরম্যান্স</p>
  </div>

  <div class="card">
    <div style="font-size: 22px;">🔔</div>
    <h3>Notices</h3>
    <p>নোটিশ বোর্ড</p>
  </div>

  <div class="card">
    <div style="font-size: 22px;">📝</div>
    <h3>Contact</h3>
    <p>যোগাযোগ</p>
  </div>
</div>

<!-- লগইন ফর্ম -->
<div class="admin-login-box">
  <h2>Admin Login</h2>
  <form>
    <div class="form-group">
      <label>ইমেইল (Admin Email)</label>
      <input type="email" placeholder="Kamrulislam977968@gmail.com" required>
    </div>
    
    <div class="form-group">
      <label>পাসওয়ার্ড (Password)</label>
      <input type="password" placeholder="••••••••" required>
    </div>

    <div class="login-btn-container">
      <button type="submit" class="login-btn">Login</button>
    </div>

    <div class="forgot-pass">
      <a href="#">পাসওয়ার্ড ভুলে গেছেন?</a>
    </div>
  </form>
</div>

</body>
</html>
